# field descriptors of the niceSmartCRM entities: the English field name is the
# key, column is the physical column of the legacy German table, json the
# spelling of the JAXB export where it differs, en and de are the labels,
# type the conversion (str where absent), pk the primary key, reference the
# referenced entity; _ describes the entity itself with its table, icon, key_field,
# display_order and description for the graph schema. One file for the mapping
# and the i18n labels, generating the English views, from_smartcrm and the
# UI labels - niceSmartCRM #6
# de labels of the first cut are the column names split into words, to be reviewed
# WF 2026-09-23
